name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json

      - name: Instalar OpenSpec CLI
        run: npm install -g @fission-ai/openspec@2.1.1

      - name: Instalar dependencias
        run: make install

      # El gate de evaluación (eval.sh --check) se activa con add-rag-core
      # y se endurece con add-deploy-and-ci.
      - name: Verificar
        env:
          OPENSPEC_TELEMETRY: "0"
        run: make verify
