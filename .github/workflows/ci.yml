name: ci

on:
  push:
    branches: [main]
  pull_request:

# Las actions se fijan por SHA completo (un tag se puede mover; un commit no).
# El comentario dice a qué versión corresponde cada SHA.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32" # la misma versión de uv que generó los uv.lock
          enable-cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json

      - name: Instalar OpenSpec CLI
        run: npm install -g @fission-ai/openspec@2.1.1

      # OCR para los tests de integración de pipelines/ingest.
      - name: Instalar Tesseract
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa

      # Modelo de embeddings (~470 MB): se baja una vez y queda en la caché de Actions.
      - name: Caché de Hugging Face
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-multilingual-e5-small-v1

      - name: Instalar dependencias
        run: make install

      # El gate de evaluación (eval.sh --check) se activa con add-rag-core
      # y se endurece con add-deploy-and-ci.
      # INTEGRATION=1: los tests de integración corren y, si falta una dependencia, fallan.
      # Los de APIs pagas se saltean porque CI no tiene claves.
      - name: Verificar
        env:
          OPENSPEC_TELEMETRY: "0"
          INTEGRATION: "1"
        run: make verify
